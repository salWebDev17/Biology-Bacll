<!DOCTYPE html>
<html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>មេរៀនប្រូតេអ៊ីន</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#dff6ff;--fg:#2b2350;--card:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120f26;--fg:#f1ecff;--card:#2a2650}}
:root[data-theme="dark"]{--bg:#120f26;--fg:#f1ecff;--card:#2a2650}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Noto Sans Khmer","Khmer OS",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:420px;padding:10px}
.body{background:linear-gradient(170deg,#8ff0ff,#c7a6ff 55%,#ff9de2);border-radius:28px;padding:10px;box-shadow:0 8px 0 #7a5cc7,0 14px 24px #0004}
.marq{background:#2d1f66;border-radius:16px;padding:6px 8px 8px;text-align:center;border:3px solid #fff8}
.lights{display:flex;justify-content:space-around;margin-bottom:3px}
.lights i{width:8px;height:8px;border-radius:50%;background:#ffe36e;box-shadow:0 0 8px #ffe36e;animation:bl 1s infinite}
.lights i:nth-child(even){background:#ff7ad9;box-shadow:0 0 8px #ff7ad9;animation-delay:.5s}
@keyframes bl{50%{opacity:.25}}
.ttl{font-size:24px;font-weight:800;color:#fff;text-shadow:0 0 10px #ff7ad9,0 0 18px #6ff3d0}
.hud{display:flex;justify-content:space-between;font-weight:700;font-size:14px;color:#2b2350;padding:6px 6px 4px}
.box{position:relative;height:270px;border-radius:16px;overflow:hidden;border:5px solid #fff9;background:linear-gradient(180deg,#14112d,#2a1f5c 70%,#4b2f86)}
.box:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#fff3 0,#fff0 28%,#fff0 60%,#fff2 75%,#fff0 76%);pointer-events:none}
.spot{position:absolute;top:0;width:90px;height:150px;background:linear-gradient(#ff7ad955,#0000);clip-path:polygon(35% 0,65% 0,100% 100%,0 100%)}
.rail{position:absolute;top:0;left:0;right:0;height:9px;background:linear-gradient(#e1dcff,#9d92d8)}
.chute{position:absolute;right:0;bottom:0;width:9.09%;height:150px;background:repeating-linear-gradient(0deg,#6ff3d033 0 10px,#6ff3d00f 10px 20px);border-left:2px dashed #6ff3d0;color:#6ff3d0;font-size:10px;text-align:center;padding-top:4px;line-height:1.2}
.floor{position:absolute;left:0;right:0;bottom:0;height:8px;background:#ff7ad9}
.line{position:absolute;width:3px;margin-left:-1.5px;top:8px;background:#d7d2ff;transition:height .7s}
.hook{position:absolute;margin-left:-15px;font-size:30px;line-height:1;transition:top .7s}
.cl{position:absolute;top:0;width:0;transition:left .22s}
.doll{position:absolute;font-size:27px;line-height:1;width:32px;margin-left:-16px;text-align:center;transition:left .22s,top .7s;filter:drop-shadow(0 2px 2px #0006)}
.slot{min-height:150px;margin-top:10px}
.card{background:var(--card);border:3px solid #ff7ad9;border-radius:16px;padding:10px;animation:pop .25s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.q{font-weight:700;margin-bottom:8px;line-height:1.5}
.ans{background:#fff3b0;color:#3a2f00;border-radius:10px;padding:8px;margin:8px 0;line-height:1.6;font-size:14px}
.msg{background:var(--card);border-radius:16px;padding:12px;font-size:15px;line-height:1.6;min-height:70px}
.row{display:flex;gap:6px}
button{font:inherit;border:0;border-radius:14px;padding:10px 12px;background:#7a5cc7;color:#fff;font-weight:700;cursor:pointer;touch-action:manipulation;box-shadow:0 4px 0 #4c3590}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #4c3590}
button:disabled{opacity:.45}
.ok{background:#2fb67a;box-shadow:0 4px 0 #1b7d54;flex:1}.no{background:#e5546d;box-shadow:0 4px 0 #a3283d;flex:1}
.pad{margin-top:12px;background:#fff6;border-radius:20px;padding:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{font-size:24px;padding:14px 0;border-radius:50%;aspect-ratio:1;width:100%}
.pad .drop{grid-column:span 2;border-radius:16px;aspect-ratio:auto;font-size:16px;background:#e5546d;box-shadow:0 4px 0 #a3283d}
.pad .rs{background:#2fb67a;box-shadow:0 4px 0 #1b7d54}
</style></head><body><div id="root"></div>
<script>
const {useState,useEffect}=React,h=React.createElement;
const QA=[
["ប្រូតេអ៊ីនជាអ្វី?","ម៉ាក្រូម៉ូលេគុលបង្កឡើងពីអាស៊ីដអាមីនេជាច្រើនចងភ្ជាប់គ្នាដោយចំណងពិបទីដ។"],
["តើមានអាស៊ីដអាមីនេប៉ុន្មានទើបក្លាយជាប្រូតេអ៊ីន?","៥០ ឡើងទៅ។"],
["តើប្រូតេអ៊ីនមានប៉ុន្មានទម្រង់?","៤ ទម្រង់ គឺទម្រង់ទី១ ទី២ ទី៣ ទី៤។"],
["ទម្រង់ទី១ កើតឡើងពីអ្វី?","កើតពីតម្រៀបលំដាប់អាស៊ីដអាមីនេសុទ្ធ។"],
["ទម្រង់ទី២ កើតឡើងនៅពេលណា?","កាលណាច្រវ៉ាក់ប៉ូលីពិបទីដបត់បែនជាខ្សែខ្ចៅ។"],
["ទម្រង់ទី២ មានប៉ុន្មានផ្នត់?","២ គឺផ្នត់ស្រប (ទិសដៅតែមួយ) និងផ្នត់មិនស្រប (ទិសដៅផ្ទុយគ្នា)។"],
["រៀបរាប់ពីទម្រង់ទី៣។","បត់បែនច្រើនផ្នត់ ក្លាយជាប្រូតេអ៊ីនគ្រាប់ ទឹកមិនជ្រាបចូល។ ដូមែនមានអាស៊ីដអាមីនេច្រើនជាង ២០០។"],
["រៀបរាប់ពីទម្រង់ទី៤។","កាន់តែសាំញ៉ាំ ព្រោះបង្កឡើងពីច្រវ៉ាក់ប៉ូលីពិបទីដ ៣ ឬ ៤។"],
["ប្រូតេអ៊ីនមាននាទីអ្វីខ្លះ?","កត្តាលីករ, ទម្រង់, អ្នកតម្រូវ, អ្នកការពារ, អ្នកធ្វើចលនា, អ្នកនាំសារ។"],
["អាំងស៊ុយលីនមាននាទីអ្វី?","បញ្ចុះកម្រិតស្ករគ្លុយកូសក្នុងឈាម។"],
["គ្លុយកាកុងមាននាទីអ្វី?","បង្កើនកម្រិតស្ករគ្លុយកូសក្នុងឈាម។"],
["កូឡាហ្សែនជាអ្វី?","សមាសធាតុចម្បងក្នុងការភ្ជាប់ជាលិកា ធ្វើឱ្យជាលិការឹងមាំ។"],
["ប្រៀបធៀបប្រូតេអ៊ីនគ្រាប់ និងសរសៃ។","គ្រាប់: មូលតូច រលាយក្នុងទឹក ជាអង់ស៊ីម អង់ទីករ។ សរសៃ: វែង មិនរលាយក្នុងទឹក ជាអ្នកការពារ។"],
["កត្តាអ្វីខ្លះធ្វើឱ្យប្រូតេអ៊ីនបាត់បង់គុណភាព?","អាស៊ីដខ្លាំងបាសខ្លាំង, អង្គធាតុរំលាយ, សាប៊ូ, ភ្នាក់ងារផ្សេងៗ, កំហាប់អំបិល, លោហៈធ្ងន់, សីតុណ្ហភាព, ចលនាមេកានិច។"]];
const EM=["🐱","🐰","👽","🐻","🦄","🐙","🍓","🐶","🐼","🐸","🦊","🐥","⭐","🐧","🐷"];
const H=270,RH=36,NC=11,CH=10,rowTop=r=>H-RH*(r+1)-10,cx=c=>(c+.5)/NC*100+"%";
const R=(a,b)=>a+Math.random()*(b-a);
const shuf=()=>{const a=QA.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const init=()=>{const a=[];let id=0;for(let c=0;c<10;c++){const n=2+Math.floor(Math.random()*3);for(let r=0;r<n;r++)a.push({id:id++,c,r,e:EM[Math.floor(Math.random()*EM.length)],done:false,rot:R(-35,35),jx:R(-9,9),jy:R(-8,5),sz:R(23,33)})}return a};
let AC;const snd=(f,d,t,s=0)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const o=AC.createOscillator(),g=AC.createGain(),T=AC.currentTime+s;o.type=t||"square";o.frequency.value=f;g.gain.setValueAtTime(.07,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+d)}catch(e){}};
const seq=(a,t,d=.12,g=.1)=>a.forEach((f,k)=>snd(f,d,t,k*g));
const S={move:()=>snd(500,.06),down:()=>seq([600,450,300],"sawtooth"),up:()=>seq([300,450,600],"sawtooth"),grab:()=>seq([220,330],"square",.15,.1),win:()=>seq([523,659,784,1047],"triangle",.15,.12),bad:()=>seq([300,200,120],"sawtooth",.2,.15),ok:()=>seq([660,880],"triangle")};
const topDoll=(ds,c)=>{for(let r=2;r>=0;r--){const d=ds.find(d=>d.c===c&&d.r===r&&!d.done);if(d)return d}return null};

function App(){
 const [st,set]=useState({col:0,down:false,held:null,phase:"idle",q:0,deck:shuf(),dolls:init(),hook:12,show:false,msg:"ភ្នាក់ងារ! ចុច ◀ ▶ ដើម្បីរើសតុក្កតា រួចចុច ▼ ដើម្បីចាប់។"});
 const up=p=>set(o=>({...o,...p}));
 const busy=st.phase==="lowering"||st.phase==="question";
 const score=st.dolls.filter(d=>d.done).length,over=score===st.dolls.length;
 const held=st.dolls.find(d=>d.id===st.held);
 const mv=dx=>{if(busy||st.down||over)return;const n=st.col+dx;if(n<0||n>=NC)return;S.move();up({col:n,msg:st.held&&n===CH?"ដល់ច្រកហើយ! ចុច 🔴 ទម្លាក់។":"ផ្លាស់ទីបន្តទៀត ឬចុច ▼ ។"})};
 const down=()=>{if(busy||st.down||st.held||over)return;const t=topDoll(st.dolls,st.col);S.down();
  up({down:true,phase:"lowering",hook:t?rowTop(t.r)-28:H-72,msg:"កំពុងចុះ..."});
  setTimeout(()=>{if(t){S.grab();up({held:t.id,phase:"carry",msg:"ចាប់បានហើយ! ចុច ▲ លើក រួច ▶ ទៅច្រកស្តាំ។"})}else{S.bad();up({down:false,hook:12,phase:"idle",msg:"ចាប់មិនបាន! ជួរនេះទទេ។"})}},800)};
 const lift=()=>{if(!st.down||busy||over)return;S.up();up({down:false,hook:12,phase:st.held?"carry":"idle",msg:st.held?"លើកឡើងហើយ! ចុច ▶ ទៅច្រកស្តាំ។":"ឡើងវិញ។"})};
 const fresh=()=>{S.ok();set({col:0,down:false,held:null,phase:"idle",q:0,deck:shuf(),dolls:init(),hook:12,show:false,msg:"ចាប់ផ្តើមថ្មី! តុក្កតាច្របូកច្របល់ហើយ។"})};
 const drop=()=>{if(over){fresh();return}
  if(busy||st.down)return;
  if(st.held&&st.col===CH){S.win();up({dolls:st.dolls.map(d=>d.id===st.held?{...d,done:true}:d),q:st.deck[0],deck:st.deck.length>1?st.deck.slice(1):shuf(),held:null,phase:"question",show:false,msg:""})}
  else if(st.held){S.bad();up({held:null,phase:"idle",msg:"ទម្លាក់ខុសកន្លែង! តុក្កតាត្រឡប់ទៅវិញ។"})}
  else snd(400,.1)};
 const next=()=>{S.ok();up({phase:"idle",msg:"🛸 សង្គ្រោះបានមួយ! រើសតុក្កតាបន្ទាប់។"})};
 useEffect(()=>{const k=e=>{const m={ArrowLeft:()=>mv(-1),ArrowRight:()=>mv(1),ArrowDown:down,ArrowUp:lift," ":drop}[e.key];if(m){e.preventDefault();m()}};window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k)});
 const lights=h("div",{className:"lights"},Array.from({length:14},(_,i)=>h("i",{key:i})));
 const slot=over?h("div",{className:"msg"},"🎉 បេសកកម្មជោគជ័យ! សង្គ្រោះបានទាំងអស់! ចុច 🔄 ដើម្បីលេងម្តងទៀត។")
 :st.phase==="question"?h("div",{className:"card"},
   h("div",{className:"q"},"❓ "+QA[st.q][0]),
   h("button",{onClick:()=>{S.move();up({show:!st.show})}},st.show?"លាក់ចម្លើយ":"បង្ហាញចម្លើយ"),
   st.show&&h("div",{className:"ans"},QA[st.q][1]),
   h("div",{className:"row",style:{marginTop:8}},h("button",{className:"ok",onClick:next},"បន្ត ▶")))
 :h("div",{className:"msg"},st.msg);
 return h("div",{className:"app"},
  h("div",{className:"body"},
   h("div",{className:"marq"},lights,h("div",{className:"ttl"},"✦ មេរៀនប្រូតេអ៊ីន ✦")),
   h("div",{className:"hud"},h("span",null,"🧸 តុក្កតារនៅសល់ "+(st.dolls.length-score)),h("span",null,"បេសកកម្ម "+String(score).padStart(2,"0")+"/"+st.dolls.length)),
   h("div",{className:"box"},
    h("div",{className:"spot",style:{left:"8%"}}),h("div",{className:"spot",style:{left:"58%",background:"linear-gradient(#6ff3d044,#0000)"}}),
    h("div",{className:"rail"}),h("div",{className:"chute"},"ច្រក",h("br"),"រង្វាន់"),h("div",{className:"floor"}),
    h("div",{className:"cl",style:{left:cx(st.col)}},h("div",{className:"line",style:{height:st.hook+6}}),h("div",{className:"hook",style:{top:st.hook}},"🪝")),
    st.dolls.filter(d=>!d.done).map(d=>{const g=d.id===st.held;return h("div",{key:d.id,className:"doll",style:{left:g?cx(st.col):"calc("+cx(d.c)+" + "+d.jx+"px)",top:g?st.hook+24:rowTop(d.r)+d.jy,fontSize:g?30:d.sz,transform:"rotate("+(g?0:d.rot)+"deg)",zIndex:g?9:d.r}},d.e)}))),
  h("div",{className:"slot"},slot),
  h("div",{className:"pad"},
   h("button",{onClick:()=>mv(-1)},"◀"),h("button",{onClick:lift},"▲"),h("button",{onClick:down},"▼"),h("button",{onClick:()=>mv(1)},"▶"),
   h("button",{className:"drop rs",onClick:fresh},"🔄 ចាប់ផ្តើមឡើងវិញ"),h("button",{className:"drop",onClick:drop},"🔴 ទម្លាក់")));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script></body></html>
