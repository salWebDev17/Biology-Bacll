  ["ចូលរៀបរាប់ពីកត្តាលោហៈធាតុធ្ងន់។", "អ៊ីយ៉ុងលោហៈធ្ងន់ ភ្ជាប់ទៅនឹងក្រុម carboxylate ឬក្រុម sulfhydryl នៃអាស៊ីតអាមីនេ បំផ្លាញសម្ព័ន្ធអ៊ីយ៉ុង ឬសម្ព័ន្ធឌីស៊ុលភួរ ធ្វើឱ្យប្រូតេអ៊ីនកកស្ទះ និងបាត់បង់ទម្រង់ដើម។"],

const EM=["🐱","🐰","👽","🐻","🦄","🐙","🍓","🐶","🐼","🐸","🦊","🐥","⭐","🐧","🐷"];
const H=270,RH=36,NC=11,CH=10,rowTop=r=>H-RH*(r+1)-10,cx=c=>(c+.5)/NC*100+"%";
const R=(a,b)=>a+Math.random()*(b-a);
const shuf=()=>{const a=QA.map((_,i)=>i);for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const init=()=>{const a=[];let id=0;for(let c=0;c<10;c++){const n=2+Math.floor(Math.random()*3);for(let r=0;r<n;r++)a.push({id:id++,c,r,e:EM[Math.floor(Math.random()*EM.length)],done:false,rot:R(-35,35),jx:R(-9,9),jy:R(-8,5),sz:R(23,33)})}return a};
let AC;const snd=(f,d,t,s=0)=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume();const o=AC.createOscillator(),g=AC.createGain(),T=AC.currentTime+s;o.type=t||"square";o.frequency.value=f;g.gain.setValueAtTime(.07,T);g.gain.exponentialRampToValueAtTime(.001,T+d);o.connect(g);g.connect(AC.destination);o.start(T);o.stop(T+d)}catch(e){}};
const seq=(a,t,d=.12,g=.1)=>a.forEach((f,k)=>snd(f,d,t,k*g));
const S={move:()=>snd(500,.06),down:()=>seq([600,450,300],"sawtooth"),up:()=>seq([300,450,600],"sawtooth"),grab:()=>seq([220,330],"square",.15,.1),win:()=>seq([523,659,784,1047],"triangle",.15,.12),bad:()=>seq([300,200,120],"sawtooth",.2,.15),ok:()=>seq([660,880],"triangle")};
const topDoll=(ds,c)=>{for(let r=4;r>=0;r--){const d=ds.find(d=>d.c===c&&d.r===r&&!d.done);if(d)return d}return null};

function App(){
 const [st,set]=useState({col:0,down:false,held:null,phase:"idle",q:0,deck:shuf(),dolls:init(),hook:12,show:false,msg:"ភ្នាក់ងារ! ចុច ◀ ▶ ដើម្បីរើសតុក្កតា រួចចុច ▼ ដើម្បីចាប់។"});
 const up=p=>set(o=>({...o,...p}));
 const busy=st.phase==="lowering"||st.phase==="question";
 const score=st.dolls.filter(d=>d.done).length,over=score===st.dolls.length;
 const held=st.dolls.find(d=>d.id===st.held);
 const mv=dx=>{if(busy||st.down||over)return;const n=st.col+dx;if(n<0||n>=NC)return;S.move();up({col:n,msg:st.held&&n===CH?"ដល់ច្រកហើយ! ចុច 🔴 ទម្លាក់។":"ផ្លាស់ទីបន្តទៀត ឬចុច ▼ ។"})};
 const down=()=>{if(busy||st.down||st.held||over)return;const t=topDoll(st.dolls,st.col);S.down();
  up({down:true,phase:"lowering",hook:t?rowTop(t.r)-28:H-72,msg:"កំពុងចុះ..."});
  setTimeout(()=>{if(t){S.grab();up({held:t.id,phase:"carry",msg:"ចាប់បានហើយ! ចុច ▲ លើក រួច ▶ ទៅច្រកស្តាំ។"})}else{S.bad();up({down:false,hook:12,phase:"idle",msg:"ចាប់មិនបាន! ជួរនេះទទេ។"})}},800)};
 const lift=()=>{if(!st.down||busy||over)return;S.up();up({down:false,hook:12,phase:st.held?"carry":"idle",msg:st.held?"លើកឡើងហើយ! ចុច ▶ ទៅច្រកស្តាំ។":"ឡើងវិញ។"})};
 const fresh=()=>{S.ok();set({col:0,down:false,held:null,phase:"idle",q:0,deck:shuf(),dolls:init(),hook:12,show:false,msg:"ចាប់ផ្តើមថ្មី! តុក្កតាច្របូកច្របល់ហើយ។"})};
 const drop=()=>{if(over){fresh();return}
  if(busy||st.down)return;
  if(st.held&&st.col===CH){S.win();up({dolls:st.dolls.map(d=>d.id===st.held?{...d,done:true}:d),q:st.deck[0],deck:st.deck.length>1?st.deck.slice(1):shuf(),held:null,phase:"question",show:false,msg:""})}
  else if(st.held){S.bad();up({held:null,phase:"idle",msg:"ទម្លាក់ខុសកន្លែង! តុក្កតាត្រឡប់ទៅវិញ។"})}
  else snd(400,.1)};
 const next=()=>{S.ok();up({phase:"idle",msg:"🛸 សង្គ្រោះបានមួយ! រើសតុក្កតាបន្ទាប់។"})};
 useEffect(()=>{const k=e=>{const m={ArrowLeft:()=>mv(-1),ArrowRight:()=>mv(1),ArrowDown:down,ArrowUp:lift," ":drop}[e.key];if(m){e.preventDefault();m()}};window.addEventListener("keydown",k);return()=>window.removeEventListener("keydown",k)});
 const lights=h("div",{className:"lights"},Array.from({length:14},(_,i)=>h("i",{key:i})));
 const slot=st.phase==="question"?h("div",{className:"card"},
   h("div",{className:"q"},"❓ "+QA[st.q][0]),
   h("button",{onClick:()=>{S.move();up({show:!st.show})}},st.show?"លាក់ចម្លើយ":"បង្ហាញចម្លើយ"),
   st.show&&h("div",{className:"ans"},QA[st.q][1]),
   h("div",{className:"row",style:{marginTop:8}},h("button",{className:"ok",onClick:next},"បន្ត ▶")))
 :over?h("div",{className:"msg"},"🎉 បេសកកម្មជោគជ័យ! សង្គ្រោះបានទាំងអស់! ចុច 🔄 ដើម្បីលេងម្តងទៀត។")

  h("div",{className:"body"},
   h("div",{className:"marq"},lights,h("div",{className:"ttl"},"✦ មេរៀនប្រូតេអ៊ីន ✦")),
   h("div",{className:"hud"},h("span",null,"🧸 តុក្កតារនៅសល់ "+(st.dolls.length-score)),h("span",null,"បេសកកម្ម "+String(score).padStart(2,"0")+"/"+st.dolls.length)),
   h("div",{className:"box"},
    h("div",{className:"spot",style:{left:"8%"}}),h("div",{className:"spot",style:{left:"58%",background:"linear-gradient(#6ff3d044,#0000)"}}),
    h("div",{className:"rail"}),h("div",{className:"chute"},"ច្រក",h("br"),"រង្វាន់"),h("div",{className:"floor"}),
    h("div",{className:"cl",style:{left:cx(st.col)}},h("div",{className:"line",style:{height:st.hook+6}}),h("div",{className:"hook",style:{top:st.hook}},"🪝")),
    st.dolls.filter(d=>!d.done).map(d=>{const g=d.id===st.held;return h("div",{key:d.id,className:"doll",style:{left:g?cx(st.col):"calc("+cx(d.c)+" + "+d.jx+"px)",top:g?st.hook+24:rowTop(d.r)+d.jy,fontSize:g?30:d.sz,transform:"rotate("+(g?0:d.rot)+"deg)",zIndex:g?9:d.r}},d.e)}))),
  h("div",{className:"slot"},slot),
  h("div",{className:"pad"},
   h("button",{onClick:()=>mv(-1)},"◀"),h("button",{onClick:lift},"▲"),h("button",{onClick:down},"▼"),h("button",{onClick:()=>mv(1)},"▶"),
   h("button",{className:"drop rs",onClick:fresh},"🔄 ចាប់ផ្តើមឡើងវិញ"),h("button",{className:"drop",onClick:drop},"🔴 ទម្លាក់")));
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
