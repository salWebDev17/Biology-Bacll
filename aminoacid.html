<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>អាស៊ីដអាមីនេ – Car Quiz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;700&display=swap">
<style>
:root{--bg:#0b1a2b;--panel:#fff8e8;--ink:#14202e;--accent:#e8590c;--ok:#0b7a5a;--muted:#5b6b7a;--line:#e3d3a8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#16283c;--ink:#f3ecd9;--accent:#ff8a4c;--ok:#4fd1a5;--muted:#9fb1c2;--line:#2b4560}}
:root[data-theme="dark"]{--panel:#16283c;--ink:#f3ecd9;--accent:#ff8a4c;--ok:#4fd1a5;--muted:#9fb1c2;--line:#2b4560}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:"Noto Sans Khmer","Khmer OS",system-ui,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%;cursor:none}
#hud{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;gap:8px;align-items:center;padding:10px 12px;color:#f3ecd9;font-weight:700;font-size:15px;pointer-events:none}
#hud span{background:#0008;border:1px solid #ffffff2a;border-radius:8px;padding:4px 10px}
#hud .sp{flex:1;background:none;border:0}
#mute{pointer-events:auto;background:#0008;color:#f3ecd9;border:1px solid #ffffff2a;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#050d18cc;box-sizing:border-box}
.ov.on{display:flex}
.card{background:var(--panel);color:var(--ink);border:2px solid var(--line);border-radius:14px;max-width:560px;width:100%;max-height:100%;overflow:auto;padding:20px;box-sizing:border-box;text-align:left;touch-action:pan-y}
.card h1{margin:0 0 8px;font-size:28px;line-height:1.5}
.card p{margin:0 0 14px;line-height:1.8;color:var(--muted)}
.qn{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:0 12px;font-weight:700;margin-bottom:8px}
#q{font-size:19px;font-weight:700;line-height:1.8;margin:0 0 14px}
#a{display:none;white-space:pre-line;line-height:1.9;font-size:17px;border-left:5px solid var(--ok);background:#0b7a5a14;border-radius:0 8px 8px 0;padding:10px 14px;margin:0 0 14px}
#a.on{display:block}
.row{display:flex;gap:10px;flex-wrap:wrap}
button.b{font:inherit;font-weight:700;font-size:17px;border-radius:10px;padding:10px 18px;cursor:pointer;border:2px solid var(--accent);background:var(--accent);color:#fff;flex:1;min-width:130px}
button.b.alt{background:transparent;color:var(--accent)}
button:focus-visible{outline:3px solid var(--ok);outline-offset:2px}
.card.wide{max-width:660px}
.card h1{font-size:24px}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tab{flex:1;font:inherit;font-weight:700;font-size:15px;padding:8px;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px;margin:0 0 12px}
.cc{font:inherit;color:var(--ink);background:#0b1a2b14;border:2px solid var(--line);border-radius:12px;padding:8px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .15s,border-color .15s}
.cc:hover{transform:translateY(-2px)}
.cc.on{border-color:var(--accent);box-shadow:0 0 0 3px #e8590c33,0 0 18px #e8590c55}
.cc canvas{width:60px;height:108px}
.cc b{font-size:14px;line-height:1.3;text-align:center}
.cc small{color:var(--muted);font-size:12px}
.bar{display:block;width:80%;height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),var(--accent))}
#sel{font-weight:700;font-size:17px;margin:0 0 12px;color:var(--accent);line-height:1.5}
#gar{pointer-events:auto;background:#0008;color:#f3ecd9;border:1px solid #ffffff2a;border-radius:8px;padding:4px 10px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><span id="s1"></span><span id="s2"></span><span id="s3"></span><span class="sp"></span><button id="gar" aria-label="change car">🚘</button><button id="mute" aria-label="sound">🔊</button></div>

<div class="ov on" id="start"><div class="card wide">
<h1>🚗 អាស៊ីដអាមីនេ</h1>
<p>បើកឡាន ឬម៉ូតូ គេចឧបសគ្គ។ ប្រសិនបើបុកអ្វីមួយ នឹងមានសំណួរលេចឡើង។<br>Steer with ← → keys, or tap the left / right side. Crash to get a question.</p>
<div class="tabs" id="vt"><button class="tab on" data-v="car">🚗 Cars</button><button class="tab" data-v="bike">🏍️ Bikes</button></div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div id="sel"></div>
<div class="row"><button class="b" id="go">ចាប់ផ្តើម / Start</button></div>
</div></div>

<div class="ov" id="qov"><div class="card" role="dialog" aria-live="polite">
<span class="qn" id="qn"></span>
<p id="q"></p>
<div id="a"></div>
<div class="row">
<button class="b alt" id="tog">បង្ហាញចម្លើយ</button>
<button class="b" id="next">បន្តបើក</button>
</div>
</div></div>

<script>
const DATA=[{"n": 1, "q": "តើធាតុបង្កសំខាន់របស់ប្រូតេអ៊ីនជាអ្វី?", "a": "ធាតុបង្កសំខាន់របស់ប្រូតេអ៊ីនជា អាស៊ីតអាមីនេ ។"}, {"n": 2, "q": "ហេតុអ្វីបានជាគ្រប់សកម្មភាពទាំងអស់របស់កោសិកាត្រូវការប្រូតេអ៊ីនជាចាំបាច់?", "a": "បានជាគ្រប់សកម្មភាពទាំងអស់របស់កោសិកាត្រូវការប្រតេអ៊ីនជាចាំបាច់ ព្រោះប្រូតេអ៊ីនជា សារធាតុគីមីគ្រឹះនៃជីវិត ។"}, {"n": 3, "q": "ដូចម្តេចដែលហៅថា អាស៊ីតអាមីនេ ?", "a": "អាស៊ីតអាមីនេ គឺជាឯកតានៃធាតុបង្ករបស់ប្រូតេអ៊ីន (ម៉ូណូមៃ) ។"}, {"n": 4, "q": "តើអាស៊ីតអាមីនេ កើតឡើងពីអ្វី?", "a": "អាស៊ីតអាមីនេ កើតឡើងពី៖\nបណ្ដុំកាបុកស៊ីល ឬ បណ្ដុំអាស៊ីត(-COOH)\nបណ្ដុំអាមីន(-NH2)\nរ៉ាឌីកាល់ R ។"}, {"n": 5, "q": "តើអាស៊ីតអាមីនេផ្សំឡើងពីធាតុគីមី អ្វីខ្លះ?", "a": "អាស៊ីតអាមីនេផ្សំឡើងពីធាតុគីមី ៖ កាបូន (C) អ៊ីដ្រូសែន (H) អុកស៊ីសែន (O) អាសូត(N) ជួនកាលមានស្ពាន់ធ័រ (S) ។"}, {"n": 7, "q": "ហេតុអ្វីបានជាគេថាអាស៊ីតអាមីនេមានលក្ខណៈជាអាស៊ីតផង និង បាសផង?", "a": "បានជាគេថាអាស៊ីតអាមីនេមានលក្ខណៈជាអាស៊ីតផង និង បាសផង ព្រោះ៖\n• នៅកម្រិត pH=7បណ្ដុំកាបុកស៊ីល (-COOH) បំបែកទៅជាទម្រង់បាស(-COO) ហើយបណ្ដុំ អាមីន(-NH2) បំបែកទៅជាទម្រង់អាស៊ីត (-NH₃+) ។\n• ដូចនេះអាស៊ីតអាមីនេនីមួយៗអាចមានលក្ខណៈជាអាស៊ីតផង និងជាបាសផង ។"}, {"n": 8, "q": "ហេតុអ្វីបានជាគេនិយាយថា អាស៊ីតអាមីនេជាអ្នកនាំសារ ?", "a": "បានជាគេនិយាយថា អាស៊ីតអាមីនេជាអ្នកនាំសារ ព្រោះវាជាអ្នកបញ្ជូនព័ត៌មានប្រសាទ ហើយមានឥទ្ធិពលទៅលើនាទីរបស់កោសិកាគោលដៅ ឬ កោសិកាសាច់ដុំ ។"}, {"n": 9, "q": "នៅPH=7 តើបណ្ដុំកាបុកស៊ីល និង បណ្ដុំអាមីន បំបែកទៅជាអ្វី?", "a": "នៅPH=7 បណ្ដុំកាបុកស៊ីល បំបែកទៅជា ទម្រង់បាស (COO) រីឯ បណ្ដុំអាមីន បំបែកទៅ ជាទម្រង់អាស៊ីត (NH3) ។"}, {"n": 10, "q": "តើអាស៊ីតអាមីនេមានប៉ុន្មានប្រភេទ? អាស៊ីតអាមីនេនីមួយៗខុសគ្នាដោយសារអ្វី?", "a": "អាស៊ីតអាមីនេមាន ២០ ប្រភេទ ។ អាស៊ីតអាមីនេនីមួយៗខុសគ្នាដោយសាររ៉ាឌីកាល់ R ។"}, {"n": 11, "q": "តើគេធ្វើដូចម្តេចទើបដឹងថាម៉ូណូបែរបស់ប្រូតេអ៊ីនជាអាស៊ីតអាមីនេ ?", "a": "គេធ្វើអីដ្រូលីសប្រតិកម្មគីមី ដែលបំបែកម៉ូលេគុលធំមួយឱ្យទៅជា ម៉ូលេគុលតូចៗ ដោយសារ ទឹក និង អង់ស៊ីម ។"}, {"n": 12, "q": "ដូចម្តេចដែលហៅថាអាស៊ីតអាមីនេស្តង់ដា?", "a": "អាស៊ីតអាមីនេមានស្តង់ជា គឺជា អាស៊ីតអាមីនេទាំង២០ប្រភេទដែលជាសារធាតុបង្កប្រូតេអ៊ីន គឺវាមានក្រមសេនេទិច សម្រាប់កំណត់ ។"}, {"n": 13, "q": "ដូចម្តេចដែលហៅថាអាស៊ីតអាមីនេមិនស្តង់ដា ?", "a": "អាស៊ីតអាមីនេគ្មានស្តង់ដា ជា អាស៊ីតអាមីនេដែលមិនមែនជាធាតុបង្ករបស់ប្រតេអ៊ីនទេ តែវាមាននាទីចាំបាច់ក្នុងមេតាប៉ូលីសកោសិកា។"}, {"n": 14, "q": "តើម៉ូណូមែររបស់ប្រតេអ៊ីនជាអ្វី?", "a": "ម៉ូណូមែររបស់ប្រូតេអ៊ីនជា អាស៊ីតអាមីនេ ។"}, {"n": 15, "q": "តើអាស៊ីតអាមីនេណាមួយដែលមានទម្រង់ខុសប្លែកពីគេ ? ហេតុអ្វី ?", "a": "នៅក្នុងចំណោមអាស៊ីតអាមីនេទាំង២០ប្រភេទ អាស៊ីតអាមីនេដែលមានទម្រង់ខុសប្លែកពីគេ គឺ ប្រូលីន ព្រោះក្នុងម៉ូលេគុលប្រូលីន អាតូម N ត្រូវបានភ្ជាប់នឹងអាតូម C ដល់ទៅពីរ ។"}, {"n": 16, "q": "តើអាស៊ីតអាមីនេភ្ជាប់គ្នាដោយសារអ្វី?", "a": "អាស៊ីតអាមីនេភ្ជាប់គ្នាដោយសារចំណងប៉ិបទីដ (សម្ព័ន្ធប៉ិបទីដ) ។"}, {"n": 17, "q": "ដូចម្តេចដែលហៅថា អ៊ីដ្រូលីស ?", "a": "អ៊ីដ្រូលិស គឺជា ប្រតិកម្មគីមី ដែលបំបែកម៉ូលេគុលធំមួយឱ្យទៅជាម៉ូលេគុលតូចៗពីរ ដោយ បន្ថែមមួយ ម៉ូលេគុលទឹក ។"}, {"n": 18, "q": "តើចំណងប៉ិបទីតកើតឡើងដោយសារអ្វី?", "a": "ចំណងប៉ិបទឹកកើតឡើងពី បណ្ដុំអាស៊ីតរបស់អាស៊ីតអាមីនេមួយ និង បណ្ដុំអាមីនរបស់អាស៊ី តអាមីនេមួយទៀតដោយផ្តាច់ចេញមួយម៉ូលេគុលទឹកចេញ ។"}, {"n": 19, "q": "ហេតុអ្វីបានជាគេហៅប្រតិកម្មសំយោគប៉ិបទីត ថាជាប្រតិកម្មដេអ៊ីដ្រាតកម្ម ?", "a": "បានជាគេហៅប្រតិកម្មសំយោគប៉ិបទីត ថាជាប្រតិកម្មដេអ៊ីដ្រាតកម្ម ពីព្រោះគ្រប់ពេលមាន ប្រតិកម្មតែងតែមានការបោះបង់ចោលនូវ OH ពី បណ្ដុំកាបុកស៊ីលរបស់អាស៊ីតអាមីនេមួយ និង H ពី បណ្ដុំអាមីន របស់អាស៊ីតអាមីនេមួយទៀត ដោយបង្កើតបានមួយម៉ូលេគុលទឹកជានិច្ច ។"}, {"n": 20, "q": "រ៉ាឌីកាល់ R របស់អាស៊ីតអាមីនេប្រភេទគ្លីស៊ីនគឺ -H ហើយរបស់ស៊ីស្តេអ៊ីនគឺ -CH₂SH ។ ចូរសរសេររូបមន្តគីមីនៃអាស៊ីតអាមីនេទាំងពីរ ។", "a": "គ្លីស៊ីន៖ H₂N–CH₂–COOH\nស៊ីស្តេអ៊ីន៖ H₂N–CH(CH₂SH)–COOH"}, {"n": 21, "q": "ហេតុអ្វីបានជាគេនិយាយថា អាស៊ីតអាមីនេជា សារធាតុចំណូលទឹក?", "a": "បានជាគេនិយាយថា អាស៊ីតអាមីនេជា សារធាតុចំណូលទឹក ព្រោះ វារលាយក្នុងទឹក ហើយ អាចឆ្លងកាត់ភ្នាសកោសិកាបាន ។"}, {"n": 22, "q": "ហេតុអ្វីបានជាគេនិយាយថាតំណលំដាប់អាស៊ីតអាមីនេកំណត់ទម្រង់ និង នាទីរបស់ប្រូតេអ៊ីន ?", "a": "បានជាគេនិយាយថាតំណលំដាប់អាស៊ីតអាមីនេកំណត់ទម្រង់ និង នាទីរបស់ប្រូតេអ៊ីន តំណលំដាប់អាស៊ីតអាមីនេក្នុងម៉ូលេគុលប្រូតេអ៊ីន ធ្វើឱ្យម៉ូលេគុលប្រូតេអ៊ីនមានទម្រង់ខុសៗគ្នា ទម្រង់ខុសៗគ្នានេះហើយជាអ្នកកំណត់នាទីរបស់ប្រូតេអ៊ីនផ្សេងៗ ក្នុងសារពាង្គកាយ។"}, {"n": 23, "q": "តើប្រតេអ៊ីនមាននាទីអ្វីខ្លះក្នុងសារពាង្គកាយ?", "a": "ក្នុងសារពាង្គកាយ មនុស្ស ប្រូតេអ៊ីន មាននាទីដូចជា៖ ជាប្រូតេអ៊ីន ទម្រង់ ជាអ្នកការពារ ជាអ្នកធ្វើចលនា ជា អ្នកតម្រូវ និងជាកាតាលីករ។"}, {"n": 24, "q": "ហេតុអ្វី បានជា គេថា ប្រតេអ៊ីនមាននាទីជា អ្នកការពារ?", "a": "បានជា គេថា ប្រូតេអ៊ីនមាននាទីជា អ្នកការពារ វាជួយការពារសារពាង្គកាយពីការជ្រៀត\nចូលនៃមេរោគ ពេលរបួស និងបង្ការការបាត់បង់ឈាមច្រើនដោយធ្វើឱ្យឈាមកក។"}, {"n": 25, "q": "តើប្រូទីតជាអ្វី?", "a": "ប្រូទឹត ជាតំណលំដាប់ច្រវាក់ អាស៊ីតអាមីនេ ដែលមានអាស៊ីតអាមីនេពីរឬច្រើន តភ្ជាប់ គ្នា ដោយសារ ចំណងប៉ិបទីត។"}, {"n": 26, "q": "គេចែកប្រទីតជាប៉ុន្មានក្រុម?អ្វីខ្លះ?", "a": "គេចែកប្រទីត ជា បីក្រុម គឺ អាស៊ីតអាមីនេ\nប៉ិបទីត និង ប្រូតេអ៊ីន។"}];
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
let W,H,DPR;
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',rs);rs();

 ['play','study'].forEach((k,i)=>{const b=AC.createGain();b.gain.value=0;b.connect(musG);B[k]={bus:b,echo:mkEcho(b,i?.36:.55,i?.3:.45)}})}

function nt(m,f,t,d,type,v,wet,att){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;att=att||.02;g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+att);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(B[m].bus);if(wet){const w=AC.createGain();w.gain.value=wet;g.connect(w);w.connect(B[m].echo)}o.start(t);o.stop(t+d+.05)}

function kick(m,t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.22);g.gain.setValueAtTime(.35,t);g.gain.exponentialRampToValueAtTime(.001,t+.28);o.connect(g);g.connect(B[m].bus);o.start(t);o.stop(t+.3)}

function tick(){if(!AC||!mode)return;while(nextT<AC.currentTime+.5){
 if(mode==='play'){
  if(stp%8===0)PCH[(stp/8|0)%4].forEach((n,i)=>pad(mf(n),nextT+i*.15,9));

 if(P.ev){f=240+rf*1500;lf=2500+rf*2500;v=P.v}else{const rpm=1800+(e.hi-1800)*rf;f=rpm/60*P.m;lf=600+rf*4200;v=P.v*(.8+.4*rf)}
 const set=(p,x)=>m===2?p.linearRampToValueAtTime(x,t):m===1?p.setValueAtTime(x,t):p.setTargetAtTime(x,t,.03);
 set(e.o.frequency,f);set(e.o2.frequency,f*2);set(e.o3.frequency,P.ev?f*3:f*.5);set(e.lp.frequency,lf);set(e.out.gain,v);
 if(e.o4)set(e.o4.frequency,f*3);if(e.nf)set(e.nf.frequency,500+rf*2500)}
function gearOf(sp){return Math.max(0,Math.min(5,Math.floor((sp-230)/70)))}
function engine(on){if(!ac())return;
 if(on&&!eng){
  if(isB(me)){const e=mkBike(me);e.bike=1;e.g=gearOf(speed/vmul());e.dip=0;setBike(e,.3,AC.currentTime,1);eng=e}
  else{const E=me.e,o=AC.createOscillator(),o2=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type=E[0];o2.type=E[0]==='sine'?'triangle':'sawtooth';o.frequency.value=E[1];o2.frequency.value=E[1]/2;o2.detune.value=7;f.type='lowpass';f.frequency.value=E[3];g.gain.value=E[4];o.connect(f);o2.connect(f);f.connect(g);g.connect(sfxG);o.start();o2.start();eng={o,o2,E,stop(){o.stop();o2.stop()}}}}
 else if(!on&&eng){try{eng.stop()}catch(e){}eng=null}}
function engUpdate(dt){const e=eng;
 if(!e.bike){const E=e.E;e.o.frequency.value=E[1]+speed*E[2];e.o2.frequency.value=(E[1]+speed*E[2])/2;return}
 const sp=speed/vmul();let rf;
 if(e.P.ev)rf=Math.max(0,Math.min(1,(sp-230)/460));
 else{const g=gearOf(sp);if(g>e.g){sfx('shift');e.dip=1}e.g=g;const r=g<5?(sp-230-70*g)/70:Math.min(1,(sp-580)/110);rf=.3+.7*Math.max(0,r);rf*=1-.3*e.dip;e.dip=Math.max(0,e.dip-dt*5)}
 setBike(e,rf,AC.currentTime,0)}
function rev(c){if(!ac())return;
 if(isB(c)){const e=mkBike(c),t=AC.currentTime;setBike(e,.1,t,1);setBike(e,.9,t+.55,2);setBike(e,.35,t+1.05,2);e.out.gain.linearRampToValueAtTime(.0001,t+1.4);e.stop(t+1.45);return}
 const t=AC.currentTime,E=c.e,o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type=E[0];f.type='lowpass';f.frequency.setValueAtTime(E[3]*.6,t);f.frequency.exponentialRampToValueAtTime(E[3]*2.5,t+.5);
 o.frequency.setValueAtTime(E[1],t);o.frequency.exponentialRampToValueAtTime(E[1]*(c.ev?4:3),t+.45);o.frequency.exponentialRampToValueAtTime(E[1]*(c.ev?2.5:1.6),t+.85);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(E[4]*3.2,t+.12);g.gain.exponentialRampToValueAtTime(.001,t+.95);o.connect(f);f.connect(g);g.connect(sfxG);o.start(t);o.stop(t+1)}
function sfx(k){if(!ac())return;const t=AC.currentTime;
 if(k==='crash'){const n=noise(.6),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.setValueAtTime(3000,t);f.frequency.exponentialRampToValueAtTime(150,t+.5);g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);n.connect(f).connect(g).connect(sfxG);n.start(t);tone(120,35,.45,'square',.35,t);tone(1800,300,.2,'sawtooth',.09,t)}
 else if(k==='pass'){const f=mf(PEN[Math.random()*PEN.length|0]+12);tone(f,f*1.5,.14,'sine',.07,t)}
 else if(k==='steer'){const n=noise(.14),f=AC.createBiquadFilter(),g=AC.createGain();f.type='bandpass';f.frequency.setValueAtTime(900,t);f.frequency.exponentialRampToValueAtTime(2600,t+.12);g.gain.value=.1;n.connect(f).connect(g).connect(sfxG);n.start(t)}
 else if(k==='select'){tone(500,1000,.1,'triangle',.15,t);tone(1000,1600,.12,'triangle',.12,t+.07)}
 else if(k==='tab'){tone(700,950,.06,'sine',.12,t)}
 else if(k==='shift'){for(let i=0;i<3;i++){const n=noise(.07),f=AC.createBiquadFilter(),g=AC.createGain(),tt=t+.02+i*.06+Math.random()*.03;f.type='bandpass';f.frequency.value=500+Math.random()*1200;f.Q.value=1.5;g.gain.value=.22-.05*i;n.connect(f).connect(g).connect(sfxG);n.start(tt)}tone(220,110,.08,'square',.05,t)}
 else if(k==='show'){tone(440,880,.12,'sine',.3,t);tone(660,1320,.14,'sine',.25,t+.07)}
 else if(k==='hide'){tone(880,440,.12,'sine',.3,t)}
 else if(k==='next'){tone(520,780,.1,'triangle',.14,t);tone(780,1040,.12,'triangle',.12,t+.1)}}
addEventListener('pointerdown',()=>{if(ac()&&!mode)music('play')});

/* ---------- game ---------- */
const LANES=3;let roadW,laneW,roadX,carY,pw,ph,cw,ch;
let lane=1,cx=0,obs=[],parts=[],dist=0,speed=260,dodged=0,crashes=0,seen=0,paused=true,started=false,deck=[],qcur=null,last=0,spawnT=0,inv=0,scroll=0,sc2=0;
function layout(){roadW=Math.min(W*.96,420);laneW=roadW/LANES;roadX=(W-roadW)/2;dims();carY=H-130}
function dims(){cw=laneW*.46;ch=cw*2;if(isB(me)){pw=laneW*.26;ph=laneW*.88}else{pw=cw;ph=ch}}
function vmul(){return isB(me)?Math.max(.9,Math.min(1.2,1+(me.top-290)/500)):(me.t==='hyper'?1.12:1)}
function laneX(l){return roadX+laneW*(l+.5)}
layout();addEventListener('resize',()=>{layout();cx=laneX(lane)});cx=laneX(lane);
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function hud(){$('s1').textContent='📏 '+(dist/10|0)+' m';$('s2').textContent='✅ '+dodged;$('s3').textContent='💥 '+crashes+'  ❓ '+seen+'/'+DATA.length}
function steer(d){if(paused)return;const n=Math.max(0,Math.min(LANES-1,lane+d));if(n!==lane){lane=n;sfx('steer')}}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')steer(-1);if(e.key==='ArrowRight'||e.key==='d')steer(1)});
cv.addEventListener('pointerdown',e=>{steer(e.clientX<W/2?-1:1)});

/* garage */
function info(){$('sel').textContent=me.n+' · '+TNAME[me.t]+' · '+me.top+' km/h'}
function buildTabs(){const T=$('tabs');T.innerHTML='';TABS[veh].forEach(([k,l])=>{const b=document.createElement('button');b.className='tab'+(k===tab?' on':'');b.textContent=l;b.onclick=()=>{tab=k;buildGrid();sfx('tab')};T.appendChild(b)});
 document.querySelectorAll('#vt .tab').forEach(b=>b.classList.toggle('on',b.dataset.v===veh))}
function buildGrid(){buildTabs();const g=$('grid');g.innerHTML='';
 ALL.filter(c=>c.t===tab).forEach(c=>{const b=document.createElement('button');b.className='cc'+(c===me?' on':'');
  b.innerHTML='<canvas width="120" height="216"></canvas><b>'+c.n+'</b><small>'+c.top+' km/h</small><span class="bar"><i style="width:'+Math.max(5,Math.min(100,Math.round((c.top-150)/3.3)))+'%"></i></span>';
  const x=b.firstChild.getContext('2d');x.scale(2,2);if(isB(c))drawVeh(x,30,54,32,92,c);else drawVeh(x,30,54,40,84,c);
  b.onclick=()=>{me=c;dims();g.querySelectorAll('.cc').forEach(e=>e.classList.remove('on'));b.classList.add('on');info();sfx('select');rev(c)};g.appendChild(b)});info()}
document.querySelectorAll('#vt .tab').forEach(b=>b.onclick=()=>{veh=b.dataset.v;tab=TABS[veh][0][0];buildGrid();sfx('tab')});
buildGrid();
$('go').onclick=()=>{ac();music('play');dims();rev(me);$('start').classList.remove('on');if(started)resume();else{started=true;paused=false;last=performance.now();engine(true)}};
$('gar').onclick=()=>{if(!started||paused)return;paused=true;engine(false);veh=isB(me)?'bike':'car';tab=me.t;buildGrid();$('go').textContent='▶ បន្ត / Continue';$('start').classList.add('on');sfx('tab')};

const KINDS=[{k:'cone',w:.5,h:.5},{k:'barrel',w:.6,h:.6},{k:'rock',w:.7,h:.6},{k:'car'}];
function spawn(){const free=Math.random()*LANES|0,n=Math.random()<.35?2:1;let ls=[0,1,2].filter(l=>l!==free);ls=shuffle(ls).slice(0,n);
 ls.forEach(l=>{const kd=KINDS[Math.random()*KINDS.length|0],isC=kd.k==='car';const sp=isC?ALL[Math.random()*ALL.length|0]:null,bk=sp&&isB(sp);obs.push({l,x:laneX(l),y:-140,w:isC?(bk?laneW*.26:cw):laneW*kd.w,h:isC?(bk?laneW*.88:ch):laneW*kd.h,k:kd.k,sp,pass:false})})}
function ask(){if(!deck.length)deck=shuffle(DATA.map((_,i)=>i));qcur=DATA[deck.pop()];seen=Math.min(DATA.length,seen+1);
 $('qn').textContent='សំណួរ '+qcur.n;$('q').textContent=qcur.q;const a=$('a');a.textContent=qcur.a;a.classList.remove('on');
 $('tog').textContent='បង្ហាញចម្លើយ';$('qov').classList.add('on');music('study');hud();$('tog').focus({preventScroll:true})}
function crash(o){crashes++;paused=true;engine(false);sfx('crash');
 for(let i=0;i<30;i++){const a=Math.random()*6.28,s=80+Math.random()*280;parts.push({x:cx,y:carY,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:[me.c,me.c2,'#ffd166'][i%3]})}
 setTimeout(ask,550)}
$('tog').onclick=()=>{const a=$('a'),on=a.classList.toggle('on');$('tog').textContent=on?'លាក់ចម្លើយ':'បង្ហាញចម្លើយ';sfx(on?'show':'hide')};
function resume(){obs=obs.filter(o=>o.y<carY-260);inv=2;paused=false;last=performance.now();engine(true)}
$('next').onclick=()=>{sfx('next');$('qov').classList.remove('on');music('play');resume()};
$('mute').onclick=e=>{muted=!muted;e.target.textContent=muted?'🔇':'🔊';if(ac()){master.gain.setTargetAtTime(muted?0:1,AC.currentTime,.05);if(!muted)sfx('next')}};

/* ---------- drawing ---------- */
function ob(o){ctx.save();ctx.translate(o.x,o.y);
 if(o.k==='cone'){ctx.fillStyle='#ff7a1a';ctx.beginPath();ctx.moveTo(0,-o.h/2);ctx.lineTo(o.w/2,o.h/2);ctx.lineTo(-o.w/2,o.h/2);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-o.w*.2,-o.h*.05,o.w*.4,o.h*.15)}
 else if(o.k==='barrel'){ctx.fillStyle='#c0392b';ctx.beginPath();ctx.roundRect(-o.w/2,-o.h/2,o.w,o.h,6);ctx.fill();ctx.fillStyle='#fff';ctx.fillRect(-o.w/2,-o.h*.12,o.w,o.h*.2)}
 else if(o.k==='rock'){ctx.fillStyle='#7d8590';ctx.beginPath();ctx.moveTo(-o.w/2,o.h/2);ctx.lineTo(-o.w*.35,-o.h*.3);ctx.lineTo(0,-o.h/2);ctx.lineTo(o.w*.4,-o.h*.2);ctx.lineTo(o.w/2,o.h/2);ctx.fill()}
 else{ctx.restore();drawVeh(ctx,o.x,o.y,o.w,o.h,o.sp);return}
 ctx.restore()}
function frame(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;
 if(!paused){speed=Math.min(620,260+dist/40)*vmul();dist+=speed*dt;scroll=(scroll+speed*dt)%80;sc2=(sc2+speed*dt)%160;spawnT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.55,1.3-speed/900)}
  cx+=(laneX(lane)-cx)*Math.min(1,dt*14);inv=Math.max(0,inv-dt);
  obs.forEach(o=>{o.y+=speed*dt;if(!o.pass&&o.y>carY+60){o.pass=true;dodged++;sfx('pass')}
   if(!inv&&Math.abs(o.x-cx)<(o.w+pw)/2-4&&Math.abs(o.y-carY)<(o.h+ph)/2-4){crash(o)}});
  obs=obs.filter(o=>o.y<H+150);
  if(eng)engUpdate(dt);hud()}
 parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=400*dt;p.l-=dt*1.3});parts=parts.filter(p=>p.l>0);
 ctx.fillStyle='#14452a';ctx.fillRect(0,0,W,H);
 if(roadX>34){for(let y=-160+sc2;y<H+160;y+=160){[[roadX-24,y],[roadX+roadW+24,y+80]].forEach(([x,yy])=>{ctx.fillStyle='#0a2c19';ctx.beginPath();ctx.arc(x+3,yy+3,15,0,6.283);ctx.fill();ctx.fillStyle='#1f7a43';ctx.beginPath();ctx.arc(x,yy,14,0,6.283);ctx.fill()})}}
 ctx.fillStyle='#3a3f47';ctx.fillRect(roadX,0,roadW,H);
 ctx.fillStyle=me.c2;ctx.fillRect(roadX-4,0,4,H);ctx.fillRect(roadX+roadW,0,4,H);
 ctx.fillStyle='#ffffffcc';for(let l=1;l<LANES;l++)for(let y=-80+scroll;y<H;y+=80)ctx.fillRect(roadX+laneW*l-2,y,4,40);
 if(!paused&&speed>430){ctx.fillStyle='#ffffff26';for(let i=0;i<10;i++)ctx.fillRect(roadX+((i*97)%roadW),(scroll*3+i*131)%H,1.5,44)}
 obs.forEach(ob);
 drawVeh(ctx,cx,carY,pw,ph,me,inv>0&&((inv*10|0)%2));
 ctx.font='700 12px system-ui,sans-serif';const tw=ctx.measureText(me.n).width;ctx.fillStyle='#000a';ctx.beginPath();ctx.roundRect(cx-tw/2-8,carY+ph/2+10,tw+16,20,10);ctx.fill();ctx.fillStyle='#fff';ctx.textAlign='center';ctx.fillText(me.n,cx,carY+ph/2+24);ctx.textAlign='left';
 parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,6,6)});ctx.globalAlpha=1;
 requestAnimationFrame(frame)}
hud();requestAnimationFrame(frame);
</script>
</body>
