<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ហ្គេមសំណួរអាស៊ីតអាមីន</title>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kantumruy Pro', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        .game-container {
            background: #ffffff;
            width: 100%;
            max-width: 750px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .game-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background: linear-gradient(90deg, #f39c12, #e74c3c, #9b59b6, #3498db);
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 10px;
            font-weight: 700;
        }
        .subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
            font-weight: 600;
        }
        .question-box {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px 20px;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 2px dashed #bdc3c7;
            transition: all 0.3s ease;
        }
        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: #2c3e50;
            line-height: 1.6;
        }
        .answer-box {
            background: #e8f8f5;
            border-left: 6px solid #1abc9c;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: left;
            display: none; /* លាក់ចម្លើយជាមុន */
            animation: slideDown 0.4s ease forwards;
        }
        .answer-box.show {
            display: block;
        }
        .answer-box p {
            font-size: 16px;
            color: #16a085;
            line-height: 1.7;
            font-weight: 600;
        }
        .answer-box .formula {
            font-family: 'Courier New', monospace;
            background: #ffffff;
            padding: 5px 10px;
            border-radius: 5px;
            display: inline-block;
            margin: 5px 0;
            color: #c0392b;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            border: none;
            padding: 14px 25px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Kantumruy Pro', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:active {
            transform: scale(0.96);
        }
        .btn-random {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            box-shadow: 0 4px 15px rgba(52, 152, 219, 0.4);
        }
        .btn-random:hover {
            box-shadow: 0 6px 20px rgba(52, 152, 219, 0.6);
        }
        .btn-show {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
        }
        .btn-show:hover {
            box-shadow: 0 6px 20px rgba(243, 156, 18, 0.6);
        }
        .btn-show:disabled {
            background: #bdc3c7;
            box-shadow: none;
            cursor: not-allowed;
        }
        .counter {
            margin-top: 20px;
            font-size: 14px;
            color: #95a5a6;
            font-weight: 600;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .pop {
            animation: pop 0.3s ease;
        }
    </style>
</head>
<body>

<div class="game-container">
    <h1>🧬 ហ្គេមសំណួរអាស៊ីតអាមីន</h1>
    <div class="subtitle">មេរៀន៖ អាស៊ីតអាមីន ឬ ប៉ូលីប៉ិបទីត</div>

    <div class="question-box" id="questionBox">
        <div class="question-text" id="questionText">ចុចប៊ូតុង "សំណួរថ្មី" ដើម្បីចាប់ផ្តើមលេង!</div>
    </div>

    <div class="answer-box" id="answerBox">
        <p id="answerText"></p>
    </div>

    <div class="btn-group">
        <button class="btn-random" id="btnRandom" onclick="randomQuestion()">
            🎲 សំណួរថ្មី
        </button>
        <button class="btn-show" id="btnShow" onclick="showAnswer()" disabled>
            👁️ បង្ហាញចម្លើយ
        </button>
    </div>

    <div class="counter" id="counter">សំណួរសរុប៖ ២២</div>
</div>

<script>
    // ==========================================
    // ១. ទិន្នន័យសំណួរ និងចម្លើយ (ដកស្រង់ពីឯកសារ)
    // ==========================================
    const questions = [
        {
            q: "តើប្រូតេអ៊ីនជាអ្វី?",
            a: "ប្រូតេអ៊ីនជា <b>ម៉ាក្រូម៉ូលេគុល</b> ដែលបង្កើតឡើងពីអាស៊ីតអាមីន (AA) ជាច្រើន ចងភ្ជាប់គ្នាពីមួយទៅមួយ ដោយសារចំណងប៉ិបទីត។"
        },
        {
            q: "តើអាស៊ីតអាមីនេ (AA) ជាអ្វីរបស់ប្រូតេអ៊ីន?",
            a: "អាស៊ីតអាមីន (AA) ជា<b>ម៉ូណូមែ</b>របស់ប្រូតេអ៊ីន ហើយប្រូតេអ៊ីនជា<b>ប៉ូលីមែ</b>នៃអាស៊ីតអាមីន (AA + … + AA = ប៉ូលីប្រូតេអ៊ីន)។"
        },
        {
            q: "តើអាស៊ីតអាមីនមានធាតុផ្សំ និងបណ្ដុំអ្វីខ្លះ?",
            a: "អាស៊ីតអាមីនមានធាតុផ្សំ C, H, O, N និងបង្កើតឡើងដោយ ៣ បណ្ដុំ ៖ <br>១. <b>បណ្ដុំកាបុកស៊ីល</b> (-COOH)<br>២. <b>បណ្ដុំអាមីន</b> (-NH₂)<br>៣. <b>រ៉ាឌីកាល់</b> R"
        },
        {
            q: "ចូរសរសេររូបមន្តលាតសង្ខេបរបស់ គ្លីស៊ីន (Glycine)?",
            a: "គ្លីស៊ីន (R = -H) ៖ <span class='formula'>NH₂-CH(H)-COOH</span>"
        },
        {
            q: "ចូរសរសេររូបមន្តលាតសង្ខេបរបស់ អាឡានីន (Alanine)?",
            a: "អាឡានីន (R = -CH₃) ៖ <span class='formula'>NH₂-CH(CH₃)-COOH</span>"
        },
        {
            q: "ចូរសរសេររូបមន្តលាតសង្ខេបរបស់ សេរីន (Serine)?",
            a: "សេរីន (R = -CH₂-OH) ៖ <span class='formula'>NH₂-CH(CH₂OH)-COOH</span>"
        },
        {
            q: "ចូរសរសេររូបមន្តលាតសង្ខេបរបស់ ស៊ីស្តេអ៊ីន (Cysteine)?",
            a: "ស៊ីស្តេអ៊ីន (R = -CH₂-SH) ៖ <span class='formula'>NH₂-CH(CH₂SH)-COOH</span>"
        },
        {
            q: "ចូរសរសេររូបមន្តលាតសង្ខេបរបស់ ទ្រេអូនីន (Threonine)?",
            a: "ទ្រេអូនីន (R = -CH(OH)-CH₃) ៖ <span class='formula'>NH₂-CH(CH(OH)CH₃)-COOH</span>"
        },
        {
            q: "នៅក្នុង pH = 7 តើអាស៊ីតអាមីនរងអ្វី?",
            a: "នៅក្នុង pH = 7 អាស៊ីតអាមីនរង<b>អ៊ីយ៉ុងកម្ម</b> ៖<br>• បណ្ដុំកាបុកស៊ីល (-COOH) បាត់បង់ប្រូតុង H⁺ ទៅជា (-COO⁻)<br>• បណ្ដុំអាមីន (-NH₂) ស្រូបយកប្រូតុង H⁺ ទៅជា (-NH₃⁺)"
        },
        {
            q: "ក្នុងចំណោមអាស៊ីតអាមីនទាំង ២០ តើអាស៊ីតអាមីនណាខ្លះដែលជាអាស៊ីតអាមីនចាំបាច់? ព្រោះអ្វី?",
            a: "អាស៊ីតអាមីនចាំបាច់ មាន <b>៨ ឬ ៩ យ៉ាង</b> ព្រោះរាងកាយមិនអាចសំយោគវាបានទេ គឺទទួលបានពីអាហារ។"
        },
        {
            q: "ហេតុអ្វីបានជាអាស៊ីតអាមីនជាភ្នាក់ងារដឹកនាំ (ឌុយ/អាមផូទែ)?",
            a: "ព្រោះវាមានបណ្ដុំអាមីន (-NH₂) ជាបាស និងបណ្ដុំកាបុកស៊ីល (-COOH) ជាអាស៊ីត។"
        },
        {
            q: "ហេតុអ្វីបានជាអង្គធាតុសរីរាង្គត្រូវការទឹក?",
            a: "ព្រោះទឹកជាភាវៈរស់ ឬជាភ្នាក់ងារដឹកនាំសារធាតុចិញ្ចឹមសម្រាប់កោសិកា និងរាងកាយទាំងមូល ហើយជាមជ្ឈដ្ឋានធ្វើប្រតិកម្មគីមីជីវៈ។"
        },
        {
            q: "នៅពេលលីពីតអ៊ីដ្រូលីស ឱ្យផលអ្វីខ្លះ?",
            a: "នៅពេលលីពីតអ៊ីដ្រូលីស ឱ្យផលជា<b>អាស៊ីតខ្លាញ់ និងគ្លីសេរ៉ុល</b>។"
        },
        {
            q: "តើអាស៊ីតអាមីនចែកចេញជាប៉ុន្មានក្រុម? អ្វីខ្លះ?",
            a: "អាស៊ីតអាមីនចែកជា ២ ក្រុម ៖<br>១. <b>អាស៊ីតអាមីនមិនចាំបាច់ ៖</b> មាន ១១ ឬ ១២ ប្រភេទ ដែលរាងកាយអាចសំយោគបាន។<br>២. <b>អាស៊ីតអាមីនចាំបាច់ ៖</b> មាន ៨ ឬ ៩ ប្រភេទ ដែលរាងកាយមិនអាចសំយោគបាន។"
        },
        {
            q: "តើចំណងប៉ិបទីតកើតឡើងដូចម្តេច?",
            a: "ចំណងប៉ិបទីតកើតឡើងរវាងបណ្ដុំកាបុកស៊ីល (-COOH) នៃអាស៊ីតអាមីនមួយ ជាមួយបណ្ដុំអាមីន (-NH₂) នៃអាស៊ីតអាមីនមួយទៀត ដោយរំដោះទឹក ១ ម៉ូលេគុល។"
        },
        {
            q: "តើចំណងប៉ិបទីតជាអ្វី?",
            a: "ចំណងប៉ិបទីតជាសមាសធាតុគីមី ឬចំណងកូវ៉ាឡង់ ដែលភ្ជាប់អាស៊ីតអាមីន ២។"
        },
        {
            q: "តើអ្វីជាភ្នាក់ងារកំណត់ទម្រង់ និងនាទីរបស់ប្រូតេអ៊ីន?",
            a: "គឺ<b>លំដាប់លំដោយ និងចំនួននៃអាស៊ីតអាមីន</b>។"
        },
        {
            q: "តើនៅពេលណាដែលបង្កើតបាន 2, 3, 4 ប៉ិបទីត?",
            a: "នៅពេលមាន 2 AA ភ្ជាប់គ្នា បង្កើតបាន 1 ចំណងប៉ិបទីត (ឌីប៉ិបទីត), 3 AA -> 2 ចំណងប៉ិបទីត (ទ្រីប៉ិបទីត), 4 AA -> 3 ចំណងប៉ិបទីត (តេត្រាប៉ិបទីត)។"
        },
        {
            q: "លំហាត់ ៖ ប្រូតេអ៊ីនមួយមានអាស៊ីតអាមីន 480 ។ តើមានចំណងប៉ិបទីតប៉ុន្មាន? តើមានម៉ូលេគុលទឹកប៉ុន្មានត្រូវបានរំដោះចេញ?",
            a: "• <b>រកចំនួនចំណងប៉ិបទីត (L') ៖</b> តាមរូបមន្ត L' = AA - 1 => L' = 480 - 1 = 479 ចំណងប៉ិបទីត។<br>• <b>រកចំនួនម៉ូលេគុលទឹក ៖</b> ដោយសារការភ្ជាប់ AA ១ ដោយចំណងប៉ិបទីត ១ រំដោះទឹក ១ ម៉ូលេគុល នាំឱ្យចំនួនម៉ូលេគុលទឹក = L' = 479 ម៉ូលេគុលទឹក។"
        },
        {
            q: "លំហាត់ ៖ ប្រូតេអ៊ីនមួយកើតឡើងពីការតភ្ជាប់គ្នានៃអាស៊ីតអាមីនតាមចំណងប៉ិបទីត ហើយរំដោះទឹកចំនួន 200 ម៉ូលេគុល។ តើប្រូតេអ៊ីននោះមានអាស៊ីតអាមីនចំនួនប៉ុន្មាន និងមានចំណងប៉ិបទីតចំនួនប៉ុន្មាន?",
            a: "• <b>រកចំនួនអាស៊ីតអាមីន (AA) ៖</b> គេមាន ចំនួនម៉ូលេគុលទឹក = L' = 200។ តាមរូបមន្ត AA = L' + 1 => AA = 200 + 1 = 201 អាស៊ីតអាមីន។<br>• <b>រកចំនួនចំណងប៉ិបទីត ៖</b> ចំនួនចំណងប៉ិបទីត = ចំនួនម៉ូលេគុលទឹក = 200 ចំណងប៉ិបទីត។"
        },
        {
            q: "ដូចម្ដេចដែលហៅថាកោសិកាគោលដៅ?",
            a: "កោសិកាគោលដៅគឺជាកោសិកាដែលមានធ្មួលអកម៉ូនសម្រាប់តម្រូវជាមួយអរម៉ូនយថាប្រភេទ។"
        }
    ];

    // ==========================================
    // ២. មុខងារសំឡេង (Web Audio API)
    // ==========================================
    let audioCtx = null;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        initAudio();
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        const now = audioCtx.currentTime;

        if (type === 'click') {
            // សំឡេងចុចប៊ូតុង (ខ្លី និងច្បាស់)
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, now);
            osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
            gainNode.gain.setValueAtTime(0.15, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'reveal') {
            // សំឡេងបង្ហាញចម្លើយ (ឡើងពីរ)
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(400, now);
            osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
            osc.frequency.exponentialRampToValueAtTime(1200, now + 0.3);
            gainNode.gain.setValueAtTime(0.2, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'error') {
            // សំឡេងព្រមាន (ករណីចុចខុស)
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, now);
            osc.frequency.exponentialRampToValueAtTime(150, now + 0.2);
            gainNode.gain.setValueAtTime(0.1, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            osc.start(now);
            osc.stop(now + 0.2);
        }
    }

    // ==========================================
    // ៣. មុខងារហ្គេម
    // ==========================================
    let currentIndex = -1;
    const questionText = document.getElementById('questionText');
    const answerBox = document.getElementById('answerBox');
    const answerText = document.getElementById('answerText');
    const btnShow = document.getElementById('btnShow');
    const questionBox = document.getElementById('questionBox');

    function randomQuestion() {
        playSound('click');

        // ជ្រើសរើសសំណួរថ្មីដែលមិនដូចលើកមុន
        let newIndex;
        if (questions.length > 1) {
            do {
                newIndex = Math.floor(Math.random() * questions.length);
            } while (newIndex === currentIndex);
        } else {
            newIndex = 0;
        }
        currentIndex = newIndex;

        const selected = questions[currentIndex];

        // បង្ហាញសំណួរ
        questionText.innerHTML = selected.q;

        // លាក់ចម្លើយចាស់
        answerBox.classList.remove('show');
        answerText.innerHTML = '';
        btnShow.disabled = false;
        btnShow.innerHTML = '👁️ បង្ហាញចម្លើយ';

        // Animation ពេលប្តូរសំណួរ
        questionBox.classList.remove('pop');
        void questionBox.offsetWidth; // Trigger reflow
        questionBox.classList.add('pop');
    }

    function showAnswer() {
        if (currentIndex === -1) {
            playSound('error');
            alert('សូមចុច "សំណួរថ្មី" ជាមុនសិន!');
            return;
        }

        playSound('reveal');

        const selected = questions[currentIndex];
        answerText.innerHTML = selected.a;
        answerBox.classList.add('show');
        btnShow.disabled = true;
        btnShow.innerHTML = '✅ បានបង្ហាញរួច';
    }
</script>

</body>
</html>
